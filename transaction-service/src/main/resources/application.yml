spring:
  config:
    import: file:E:/fincore/.env[.properties]
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://localhost:5433/${TRANSACTION_DB_NAME:transaction_db}
    username: transaction_user
    password: ${TRANSACTION_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      max-lifetime: 900000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/platform
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true

server:
  port: 8084
  shutdown: graceful

fincore:
  kafka.enabled: true
  outbox.enabled: true
  security:
    jwt-secret: ${JWT_SECRET:}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  recovery:
    stale-after-seconds: 120
    poll-interval-ms: 30000
    max-attempts: 10
  downstream:
    account:
      base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8083}
      connect-timeout-ms: 1000
      read-timeout-ms: 2000
    risk:
      base-url: ${RISK_SERVICE_URL:http://localhost:8086}
      connect-timeout-ms: 1000
      read-timeout-ms: 2000

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never
  metrics.tags.application: ${spring.application.name}
  tracing.sampling.probability: ${TRACING_SAMPLING:1.0}
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    org.apache.kafka: WARN

resilience4j:
  circuitbreaker:
    instances:
      account: &cb
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.fincore.transaction.client.DownstreamRejectedException
      risk: *cb
  retry:
    instances:
      account: &retry
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true          # jitter
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.fincore.transaction.client.DownstreamUnavailableException
      risk: *retry
  bulkhead:
    instances:
      risk:
        max-concurrent-calls: 20
        max-wait-duration: 0
