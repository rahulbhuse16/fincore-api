
name: ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # 1. Domain verification
  domain-tests:
    name: Domain Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify domain
        run: bash scripts/verify-domain.sh


  # 2. Build and integration tests
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Diagnose Docker daemon
      - name: Diagnose Docker environment
        run: |
          echo "=== Docker API environment ==="
          echo "DOCKER_API_VERSION=${DOCKER_API_VERSION:-not-set}"
          echo "DOCKER_HOST=${DOCKER_HOST:-not-set}"

          echo "=== Docker client and server ==="
          docker version

          echo "=== Docker information ==="
          docker info

          echo "=== Running containers ==="
          docker ps

      # Configure Docker Java API for Testcontainers
      - name: Configure Testcontainers Docker API
        run: |
          mkdir -p customer-service/src/test/resources
          echo "api.version=1.44" > customer-service/src/test/resources/docker-java.properties

          echo "=== Docker Java configuration ==="
          cat customer-service/src/test/resources/docker-java.properties

      # Inspect actual resolved dependencies
      - name: Inspect Testcontainers dependencies
        run: |
          mvn -B -ntp -pl customer-service dependency:tree \
            -Dverbose \
            -Dincludes=org.testcontainers:*,com.github.docker-java:*

      # Build and run all tests
      - name: Build and Test
        run: mvn -B -ntp verify

      # Upload reports even when build fails
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fincore-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7


  # 3. Docker Compose validation
  compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Initialize environment
        run: bash scripts/init-env.sh

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose --profile observability config --quiet
