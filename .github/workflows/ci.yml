name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  domain-tests:
    name: Framework-free domain tests (fast feedback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: scripts/verify-domain.sh

  build-and-test:
    name: Maven build, unit tests and Testcontainers integration tests
    runs-on: ubuntu-latest          # ships with Docker, which Testcontainers needs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: mvn verify (unit tests via surefire, *IT via failsafe)
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/target/*-reports/**'

  compose-validate:
    name: docker compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/init-env.sh && docker compose config --quiet && docker compose --profile observability config --quiet
