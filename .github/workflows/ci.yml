
name: ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # --------------------------------------------------
  # 1. Domain verification
  # --------------------------------------------------
  domain-tests:
    name: Domain Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify domain
        run: bash scripts/verify-domain.sh


  # --------------------------------------------------
  # 2. Build and integration tests
  # --------------------------------------------------
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Diagnostic: identify Testcontainers and Docker Java versions
      - name: Inspect Testcontainers dependencies
        run: |
          mvn -B -ntp -pl customer-service dependency:tree \
            -Dincludes=org.testcontainers,com.github.docker-java

      # Run complete Maven build and tests
      - name: Build and Test
        run: mvn -B -ntp verify

      # Preserve test reports even when tests fail
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fincore-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7


  # --------------------------------------------------
  # 3. Docker Compose validation
  # --------------------------------------------------
  compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Initialize environment
        run: bash scripts/init-env.sh

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose --profile observability config --quiet
