# FinCore local environment.  Quick start:  scripts/init-env.sh && docker compose up -d --build
# Jaeger (traces, http://localhost:16686) always starts. Add  --profile observability  for Prometheus, Grafana and the Kafka exporter.
name: fincore

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: docker
  JWT_SECRET: ${JWT_SECRET:?run scripts/init-env.sh first}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?}
      RISK_DB_PASSWORD: ${RISK_DB_PASSWORD:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      RECONCILIATION_DB_PASSWORD: ${RECONCILIATION_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports: ["127.0.0.1:29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run scripts/init-env.sh first}"]
    ports: [ "127.0.0.1:6379:6379" ]

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  identity-service:
    build:
      context: .
      args:
        MODULE: identity-service
    environment:
      <<: *app-env
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      SPRING_DATASOURCE_USERNAME: identity_user
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?}
    ports: ["127.0.0.1:8081:8081"]   # dev convenience (Swagger UI at /swagger-ui.html); production exposes only the gateway
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  customer-service:
    build:
      context: .
      args:
        MODULE: customer-service
    environment:
      <<: *app-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_db
      SPRING_DATASOURCE_USERNAME: customer_user
      SPRING_DATASOURCE_PASSWORD: ${CUSTOMER_DB_PASSWORD}
    ports: ["127.0.0.1:8082:8082"]   # dev convenience (Swagger UI at /swagger-ui.html); production exposes only the gateway
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  account-service:
    build:
      context: .
      args:
        MODULE: account-service
    environment:
      <<: *app-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: account_user
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    ports: ["127.0.0.1:8083:8083"]   # dev convenience (Swagger UI at /swagger-ui.html); production exposes only the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  transaction-service:
    build:
      context: .
      args:
        MODULE: transaction-service
    environment:
      <<: *app-env
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: transaction_user
      SPRING_DATASOURCE_PASSWORD: ${TRANSACTION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8083
      RISK_SERVICE_URL: http://risk-service:8086
    ports: ["127.0.0.1:8084:8084"]   # dev convenience (Swagger UI at /swagger-ui.html); production exposes only the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_healthy
      risk-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  ledger-service:
    build:
      context: .
      args:
        MODULE: ledger-service
    environment:
      <<: *app-env
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: ledger_user
      SPRING_DATASOURCE_PASSWORD: ${LEDGER_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["127.0.0.1:8085:8085"]   # dev convenience (Swagger UI at /swagger-ui.html); production exposes only the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  risk-service:
    build:
      context: .
      args:
        MODULE: risk-service
    environment:
      <<: *app-env
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/risk_db
      SPRING_DATASOURCE_USERNAME: risk_user
      SPRING_DATASOURCE_PASSWORD: ${RISK_DB_PASSWORD}
    ports: ["127.0.0.1:8086:8086"]   # dev convenience (Swagger UI at /swagger-ui.html); production exposes only the gateway
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    environment:
      <<: *app-env
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_FAILURE_SIMULATION: ${NOTIFICATION_FAILURE_SIMULATION:-false}
    ports: ["127.0.0.1:8087:8087"]   # dev convenience (Swagger UI at /swagger-ui.html); production exposes only the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  reconciliation-service:
    build:
      context: .
      args:
        MODULE: reconciliation-service
    environment:
      <<: *app-env
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reconciliation_db
      SPRING_DATASOURCE_USERNAME: reconciliation_user
      SPRING_DATASOURCE_PASSWORD: ${RECONCILIATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["127.0.0.1:8088:8088"]   # dev convenience (Swagger UI at /swagger-ui.html); production exposes only the gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      <<: *app-env
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports: ["8080:8080"]
    depends_on:
      redis: {condition: service_healthy}
      identity-service: {condition: service_healthy}
      customer-service: {condition: service_healthy}
      account-service: {condition: service_healthy}
      transaction-service: {condition: service_healthy}
      ledger-service: {condition: service_healthy}
      risk-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
      reconciliation-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # ---------------- observability (docker compose --profile observability up -d) ----------------
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: [observability]
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: {condition: service_healthy}

volumes:
  pgdata:
  kafkadata:
