global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['identity-service:8081']
  - job_name: customer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['customer-service:8082']
  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['account-service:8083']
  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['transaction-service:8084']
  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ledger-service:8085']
  - job_name: risk-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['risk-service:8086']
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8087']
  - job_name: reconciliation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['reconciliation-service:8088']
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
