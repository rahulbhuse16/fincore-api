spring:
  config:
    import: file:E:/fincore/.env[.properties]
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5433/${ACCOUNT_DB_NAME:account_db}
    username: account_user
    password: ${ACCOUNT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      max-lifetime: 900000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/platform
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true

server:
  port: 8083
  shutdown: graceful

fincore:
  kafka.enabled: true
  outbox.enabled: true
  security:
    jwt-secret: ${JWT_SECRET:}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  accounts:
    max-per-customer: 5
    default-per-transfer-limit: 50000
    default-daily-limit: 200000
  downstream:
    customer:
      base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
      read-timeout-ms: 2000

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never
  metrics.tags.application: ${spring.application.name}
  tracing.sampling.probability: ${TRACING_SAMPLING:1.0}
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    org.apache.kafka: WARN

resilience4j:
  circuitbreaker:
    instances:
      customer:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      customer:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.fincore.account.client.CustomerClient$CustomerServiceUnavailableException
