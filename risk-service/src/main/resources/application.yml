spring:
  config:
    import: file:E:/fincore/.env[.properties]
  application:
    name: risk-service
  datasource:
    url: jdbc:postgresql://localhost:5433/${RISK_DB_NAME:risk_db}
    username: risk_user
    password: ${RISK_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      max-lifetime: 900000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/platform
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true

server:
  port: 8086
  shutdown: graceful

fincore:
  kafka.enabled: false
  outbox.enabled: false
  security:
    jwt-secret: ${JWT_SECRET:}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  risk:
    hard-limit-per-transfer: 500000
    review-threshold: 100000
    daily-cumulative-limit: 1000000
    velocity-window: 10m
    velocity-review-count: 5
    velocity-reject-count: 10
    repeat-window: 1h
    repeat-review-count: 3

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never
  metrics.tags.application: ${spring.application.name}
  tracing.sampling.probability: ${TRACING_SAMPLING:1.0}
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
